packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false

# nextra 4.6.1 breaks with zod >=4.4 (z.custom rejects undefined children in LayoutPropsSchema)
overrides:
  "nextra>zod": "~4.3.6"
  "nextra-theme-docs>zod": "~4.3.6"
  # one web3.js v1 instance across Exponent (pins 1.98.4) and JupLend (^1.98.4)
  "@solana/web3.js@1": "1.98.4"
